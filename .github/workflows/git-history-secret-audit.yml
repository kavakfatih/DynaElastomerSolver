name: Full Git History Secret Audit

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-git-history-secret-audit:
    name: Full Git History Secret Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # actions/checkout v7.0.1 — immutable SHA pin
      - name: Tam Git geçmişini al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tüm branch ve tag reflerini getir
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          echo "Ulaşılabilir commit sayısı: $(git rev-list --all --count)"
          echo "Ulaşılabilir obje sayısı: $(git rev-list --objects --all | wc -l | tr -d ' ')"

      - name: Tüm ulaşılabilir Git bloblarını tara
        shell: bash
        run: |
          set -euo pipefail
          python tools/security/audit_git_history.py \
            --report git-history-secret-audit-report.json

      # actions/upload-artifact v6 — immutable SHA pin
      - name: Secret içermeyen audit özetini sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-git-history-secret-audit
          path: git-history-secret-audit-report.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
