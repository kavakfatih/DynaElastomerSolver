name: B7b Apply Production Direct

on:
  push:
    branches: ['develop/v0.3']
    paths:
      - '.github/scripts/b7b_apply_production_direct.py'
      - '.github/workflows/b7b-apply-production-direct.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/b7b_apply_production_direct.py'
      - '.github/workflows/b7b-apply-production-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    # Yalnız develop/v0.3 kaynağından gelen kendi PR'ımızda yazma yapar.
    if: github.event_name == 'push' || github.head_ref == 'develop/v0.3'
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop/v0.3
          fetch-depth: 0

      - name: B7b patch uygula
        run: python .github/scripts/b7b_apply_production_direct.py

      - name: Diff kalite kontrolu
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Teknik commit ve push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/fortran/solvers/des_linear_solver.f90 \
            src/fortran/solvers/des_mumps_adapter.c \
            src/fortran/solvers/des_mumps_backend.f90 \
            src/fortran/solvers/des_mumps_backend_stub.f90 \
            src/fortran/solvers/des_sparse_solver_context.f90 \
            tests/test_auto_sparse_solver_policy.f90 \
            tests/test_mumps_sparse_solver_context.f90
          git diff --cached --check
          git commit -m 'solver: production MUMPS direct kontrollerini ekle'
          git push origin HEAD:develop/v0.3
