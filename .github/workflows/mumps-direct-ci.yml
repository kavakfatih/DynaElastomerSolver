name: MUMPS Direct CI

on:
  push:
    branches: ['develop/v0.3']
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/DESDependencies.cmake'
      - 'src/fortran/CMakeLists.txt'
      - 'src/fortran/core/des_status.f90'
      - 'src/fortran/solvers/des_linear_solver.f90'
      - 'src/fortran/solvers/des_sparse_solver_context.f90'
      - 'src/fortran/solvers/des_mumps_backend*.f90'
      - 'src/fortran/solvers/des_mumps_adapter.c'
      - 'src/fortran/solvers/des_solver_history.f90'
      - 'src/fortran/solvers/des_nonlinear_solver.f90'
      - 'src/fortran/solvers/des_adaptive_increment.f90'
      - 'src/fortran/solvers/des_adaptive_predictor.f90'
      - 'src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90'
      - 'src/fortran/solvers/des_q9_herrmann_solver_report.f90'
      - 'tests/CMakeLists.txt'
      - 'tests/test_mumps*.f90'
      - 'tests/test_auto_sparse_solver_policy.f90'
      - 'tests/test_nonlinear_solver_policy.f90'
      - 'tests/test_adaptive_increment_policy.f90'
      - 'tests/test_adaptive_predictor_policy.f90'
      - 'tests/test_status_message.f90'
      - 'tests/test_q9_herrmann_*.f90'
      - 'tests/test_v03_herrmann_*.f90'
      - 'tests/benchmark_v03_herrmann_performance.f90'
      - 'tools/verification/compare_v03_herrmann_performance.py'
      - '.github/workflows/mumps-direct-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/DESDependencies.cmake'
      - 'src/fortran/CMakeLists.txt'
      - 'src/fortran/core/des_status.f90'
      - 'src/fortran/solvers/des_linear_solver.f90'
      - 'src/fortran/solvers/des_sparse_solver_context.f90'
      - 'src/fortran/solvers/des_mumps_backend*.f90'
      - 'src/fortran/solvers/des_mumps_adapter.c'
      - 'src/fortran/solvers/des_solver_history.f90'
      - 'src/fortran/solvers/des_nonlinear_solver.f90'
      - 'src/fortran/solvers/des_adaptive_increment.f90'
      - 'src/fortran/solvers/des_adaptive_predictor.f90'
      - 'src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90'
      - 'src/fortran/solvers/des_q9_herrmann_solver_report.f90'
      - 'tests/CMakeLists.txt'
      - 'tests/test_mumps*.f90'
      - 'tests/test_auto_sparse_solver_policy.f90'
      - 'tests/test_nonlinear_solver_policy.f90'
      - 'tests/test_adaptive_increment_policy.f90'
      - 'tests/test_adaptive_predictor_policy.f90'
      - 'tests/test_status_message.f90'
      - 'tests/test_q9_herrmann_*.f90'
      - 'tests/test_v03_herrmann_*.f90'
      - 'tests/benchmark_v03_herrmann_performance.f90'
      - 'tools/verification/compare_v03_herrmann_performance.py'
      - '.github/workflows/mumps-direct-ci.yml'
  workflow_dispatch:

concurrency:
  group: dyna-v03-mumps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  LAPACK_COMMIT: 6ec7f2bc4ecf4c4a93496aa2fa519575bc0e39ca

jobs:
  mumps-direct:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14 / MUMPS
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-linux-gfortran14
          - name: macOS ARM64 / gfortran 14 / MUMPS
            os: macos-26
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-macos-gfortran14
          - name: Windows / gfortran 14 / MUMPS
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-windows-gfortran14
          - name: Windows 2022 / Intel ifx 2025.2 / MUMPS
            os: windows-2022
            compiler: intel
            compiler_version: '2025.2'
            status_context: dyna/v0.3-mumps-windows-ifx2025.2

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      - name: Fortran derleyicisini kur
        id: setup_fortran
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          echo "CC=${CC:-<auto>}"
          "$FC" --version || "$FC" /QV
          "${CC:-cc}" --version || true
          cmake --version
          ninja --version
          fypp --version

      - name: Reference LAPACK 3.12.1 derle
        id: lapack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third-party/lapack-src third-party/lapack-build third-party/lapack-install
          mkdir -p third-party
          git clone --filter=blob:none --no-checkout \
            https://github.com/Reference-LAPACK/lapack.git third-party/lapack-src
          git -C third-party/lapack-src checkout --detach "$LAPACK_COMMIT"
          test "$(git -C third-party/lapack-src rev-parse HEAD)" = "$LAPACK_COMMIT"

          cmake -S third-party/lapack-src -B third-party/lapack-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCBLAS=OFF \
            -DLAPACKE=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/third-party/lapack-install" \
            > lapack-configure.log 2>&1
          cat lapack-configure.log
          cmake --build third-party/lapack-build --target install --parallel 2 \
            > lapack-build.log 2>&1
          cat lapack-build.log

      - name: Production MUMPS preset CMake configure
        id: configure
        shell: bash
        run: |
          cmake --preset dyna-production \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DCMAKE_PREFIX_PATH="$PWD/third-party/lapack-install" \
            -DLAPACK_VENDOR=Netlib \
            > cmake-mumps-configure.log 2>&1
          cat cmake-mumps-configure.log

      - name: MUMPS context, B8 robustness ve B9 baseline targetlarini derle
        id: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset dyna-production --target \
            test_mumps_sparse_solver_context \
            test_auto_sparse_solver_policy \
            test_nonlinear_solver_policy \
            test_adaptive_increment_policy \
            test_adaptive_predictor_policy \
            test_q9_herrmann_convergence_report \
            test_q9_herrmann_nonfinite_guard \
            test_q9_herrmann_adaptive_increment_growth \
            test_q9_herrmann_adaptive_predictor \
            test_q9_herrmann_sparse_force_solver \
            test_q9_herrmann_sparse_adaptive_force_solver \
            test_q9_herrmann_mumps_failure_cutback \
            benchmark_v03_herrmann_performance \
            --parallel 2 --verbose 2>&1 | tee mumps-build.log

      - name: MUMPS direct, AUTO, B8 robustness ve Q9/P1 parity regression
        id: ctest
        shell: bash
        run: |
          ctest --preset dyna-production \
            -R '^(solver\.sparse\.mumps_direct_context|solver\.sparse\.auto_policy|solver\.nonlinear\.line_search_policy|solver\.adaptive\.increment_policy|solver\.adaptive\.predictor_policy|solver\.q9\.plane_strain\.herrmann\.convergence_report|solver\.q9\.plane_strain\.herrmann\.nonfinite_guard|solver\.q9\.plane_strain\.herrmann\.adaptive_increment_growth|solver\.q9\.plane_strain\.herrmann\.adaptive_predictor|solver\.q9\.plane_strain\.herrmann\.mumps_force_parity|solver\.q9\.plane_strain\.herrmann\.mumps_adaptive_force_parity|solver\.q9\.plane_strain\.herrmann\.mumps_failure_cutback)$' \
            --output-on-failure

      - name: Q9/P1 Herrmann GMRES ve MUMPS same-runner performance baseline ölç
        id: perf
        if: matrix.os == 'ubuntu-24.04' && steps.ctest.outcome == 'success'
        shell: bash
        run: |
          cd build/presets/production/tests
          /usr/bin/time -v -o V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt \
            ./benchmark_v03_herrmann_performance gmres
          /usr/bin/time -v -o V0.3_HERRMANN_PERFORMANCE_MUMPS_RSS.txt \
            ./benchmark_v03_herrmann_performance mumps

          python -m json.tool V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json > /dev/null
          python -m json.tool V0.3_HERRMANN_PERFORMANCE_MUMPS_RESULTS.json > /dev/null
          python "$GITHUB_WORKSPACE/tools/verification/compare_v03_herrmann_performance.py" \
            --gmres V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json \
            --mumps V0.3_HERRMANN_PERFORMANCE_MUMPS_RESULTS.json \
            --output V0.3_HERRMANN_PERFORMANCE_COMPARISON.json
          python -m json.tool V0.3_HERRMANN_PERFORMANCE_COMPARISON.json > /dev/null

          echo '=== Q9/P1 Herrmann GMRES performance JSON ==='
          cat V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json
          echo
          echo '=== Q9/P1 Herrmann MUMPS performance JSON ==='
          cat V0.3_HERRMANN_PERFORMANCE_MUMPS_RESULTS.json
          echo
          echo '=== Same-runner GMRES/MUMPS comparison ==='
          cat V0.3_HERRMANN_PERFORMANCE_COMPARISON.json
          echo
          echo '=== Herrmann GMRES process peak RSS (/usr/bin/time -v) ==='
          cat V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt
          echo
          echo '=== Herrmann MUMPS process peak RSS (/usr/bin/time -v) ==='
          cat V0.3_HERRMANN_PERFORMANCE_MUMPS_RSS.txt

      - name: MUMPS platform status yayınla
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup_fortran.outcome }}
          LAPACK_OUTCOME: ${{ steps.lapack.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
          PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          $perfOk = $true
          if ('${{ matrix.os }}' -eq 'ubuntu-24.04') {
            $perfOk = ($env:PERF_OUTCOME -eq 'success')
          }
          $passed = (
            $env:SETUP_OUTCOME -eq 'success' -and
            $env:LAPACK_OUTCOME -eq 'success' -and
            $env:CONFIGURE_OUTCOME -eq 'success' -and
            $env:BUILD_OUTCOME -eq 'success' -and
            $env:CTEST_OUTCOME -eq 'success' -and
            $perfOk
          )
          $state = if ($passed) { 'success' } else { 'failure' }
          $description = "setup=$($env:SETUP_OUTCOME); lapack=$($env:LAPACK_OUTCOME); configure=$($env:CONFIGURE_OUTCOME); build=$($env:BUILD_OUTCOME); ctest=$($env:CTEST_OUTCOME); perf=$($env:PERF_OUTCOME)"
          if ($description.Length -gt 140) {
            $description = $description.Substring(0, 140)
          }

          $body = @{
            state = $state
            context = '${{ matrix.status_context }}'
            description = $description
            target_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}' `
            -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Dependency, configure, build ve performance loglarini sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mumps-configure-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: |
            lapack-configure.log
            lapack-build.log
            cmake-mumps-configure.log
            mumps-build.log
            build/presets/production/tests/V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json
            build/presets/production/tests/V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt
            build/presets/production/tests/V0.3_HERRMANN_PERFORMANCE_MUMPS_RESULTS.json
            build/presets/production/tests/V0.3_HERRMANN_PERFORMANCE_MUMPS_RSS.txt
            build/presets/production/tests/V0.3_HERRMANN_PERFORMANCE_COMPARISON.json
          if-no-files-found: warn
          retention-days: 7
