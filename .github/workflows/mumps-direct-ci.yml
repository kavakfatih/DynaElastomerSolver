name: MUMPS Direct CI

on:
  push:
    branches: ['develop/v0.3']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/DESDependencies.cmake'
      - 'src/fortran/CMakeLists.txt'
      - 'src/fortran/solvers/des_linear_solver.f90'
      - 'src/fortran/solvers/des_sparse_solver_context.f90'
      - 'src/fortran/solvers/des_mumps_backend*.f90'
      - 'src/fortran/solvers/des_mumps_adapter.c'
      - 'src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90'
      - 'tests/CMakeLists.txt'
      - 'tests/test_mumps*.f90'
      - '.github/workflows/mumps-direct-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/DESDependencies.cmake'
      - 'src/fortran/CMakeLists.txt'
      - 'src/fortran/solvers/des_linear_solver.f90'
      - 'src/fortran/solvers/des_sparse_solver_context.f90'
      - 'src/fortran/solvers/des_mumps_backend*.f90'
      - 'src/fortran/solvers/des_mumps_adapter.c'
      - 'src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90'
      - 'tests/CMakeLists.txt'
      - 'tests/test_mumps*.f90'
      - '.github/workflows/mumps-direct-ci.yml'
  workflow_dispatch:

concurrency:
  group: dyna-v03-mumps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  mumps-direct:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14 / MUMPS
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-linux-gfortran14
          - name: macOS ARM64 / gfortran 14 / MUMPS
            os: macos-26
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-macos-gfortran14
          - name: Windows / gfortran 14 / MUMPS
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-mumps-windows-gfortran14
          - name: Windows 2022 / Intel ifx 2025.2 / MUMPS
            os: windows-2022
            compiler: intel
            compiler_version: '2025.2'
            status_context: dyna/v0.3-mumps-windows-ifx2025.2

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      # fortran-lang/setup-fortran v1.9.0
      - name: Fortran derleyicisini kur
        id: setup_fortran
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          echo "CC=${CC:-<auto>}"
          "$FC" --version || "$FC" /QV
          "${CC:-cc}" --version || true
          cmake --version
          ninja --version
          fypp --version

      - name: MUMPS-enabled CMake configure
        id: configure
        shell: bash
        run: |
          cmake -S . -B build-mumps -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DDES_BUILD_TESTS=ON \
            -DDES_ENABLE_MUMPS=ON \
            > cmake-mumps-configure.log 2>&1
          cat cmake-mumps-configure.log

      - name: MUMPS context target derle
        id: build
        shell: bash
        run: cmake --build build-mumps --target test_mumps_sparse_solver_context --parallel 2

      - name: MUMPS direct context regression
        id: ctest
        shell: bash
        run: |
          ctest --test-dir build-mumps \
            -R '^solver\.sparse\.mumps_direct_context$' \
            --output-on-failure --build-config Debug

      - name: MUMPS platform status yayınla
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup_fortran.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
        run: |
          $passed = (
            $env:SETUP_OUTCOME -eq 'success' -and
            $env:CONFIGURE_OUTCOME -eq 'success' -and
            $env:BUILD_OUTCOME -eq 'success' -and
            $env:CTEST_OUTCOME -eq 'success'
          )
          $state = if ($passed) { 'success' } else { 'failure' }
          $description = "setup=$($env:SETUP_OUTCOME); configure=$($env:CONFIGURE_OUTCOME); build=$($env:BUILD_OUTCOME); ctest=$($env:CTEST_OUTCOME)"
          if ($description.Length -gt 140) {
            $description = $description.Substring(0, 140)
          }

          $body = @{
            state = $state
            context = '${{ matrix.status_context }}'
            description = $description
            target_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}' `
            -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: MUMPS configure logunu sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mumps-configure-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: cmake-mumps-configure.log
          if-no-files-found: warn
          retention-days: 7
