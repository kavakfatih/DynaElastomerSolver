name: FEniCSx V0.2 Reference

on:
  push:
    branches: [main]
    paths:
      - 'tools/reference/fenicsx_v02_homogeneous_extension.py'
      - '.github/workflows/fenicsx-reference.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/reference/fenicsx_v02_homogeneous_extension.py'
      - '.github/workflows/fenicsx-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homogeneous-extension:
    name: DOLFINx v0.11.0 / homojen extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: FEniCSx referans imajını al
        run: docker pull dolfinx/dolfinx:v0.11.0

      - name: Bağımsız FEM referansını çalıştır
        shell: bash
        run: |
          mkdir -p reference-results
          set +e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            dolfinx/dolfinx:v0.11.0 \
            python3 tools/reference/fenicsx_v02_homogeneous_extension.py \
            > reference-results/fenicsx-run.log 2>&1
          status=$?
          set -e

          cat reference-results/fenicsx-run.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 50 reference-results/fenicsx-run.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error file=tools/reference/fenicsx_v02_homogeneous_extension.py::FEniCSx referans koşusu başarısız: ${message}"
            exit "$status"
          fi

      - name: Referans sonucunu göster
        run: cat reference-results/fenicsx_v02_homogeneous_extension.json
