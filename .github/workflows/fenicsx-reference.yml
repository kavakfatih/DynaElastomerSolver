name: FEniCSx V0.2 Reference

on:
  push:
    branches: [main]
    paths:
      - 'tools/reference/fenicsx_v02_homogeneous_extension.py'
      - '.github/workflows/fenicsx-reference.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/reference/fenicsx_v02_homogeneous_extension.py'
      - '.github/workflows/fenicsx-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homogeneous-extension:
    name: DOLFINx v0.11.0 / homojen extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: FEniCSx referans imajını al
        run: docker pull dolfinx/dolfinx:v0.11.0

      - name: Bağımsız FEM referansını çalıştır
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            dolfinx/dolfinx:v0.11.0 \
            python3 tools/reference/fenicsx_v02_homogeneous_extension.py

      - name: Referans sonucunu göster
        run: cat reference-results/fenicsx_v02_homogeneous_extension.json
