name: B6 Apply Verified Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b6-source-snapshot.yml'

permissions:
  contents: write

jobs:
  apply-b6b:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: develop/v0.3 head'ini al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop/v0.3
          fetch-depth: 0

      - name: Doğrulanmış B6b patchini uygula
        shell: bash
        run: |
          python .github/scripts/b6_apply_patch.py
          git diff --check
          awk 'length($0)>132 { print FNR ":" length($0) ":" $0; bad=1 } END { exit bad }' \
            src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90 \
            tests/test_q9_herrmann_sparse_force_solver.f90 \
            tests/test_q9_herrmann_sparse_adaptive_force_solver.f90

      - name: B6b teknik commitini oluştur
        shell: bash
        run: |
          git rm .github/workflows/b6-source-snapshot.yml
          git rm .github/scripts/b6_apply_patch.py
          git add \
            src/fortran/solvers/des_q9_plane_strain_herrmann_force_solver.f90 \
            tests/test_q9_herrmann_sparse_force_solver.f90 \
            tests/test_q9_herrmann_sparse_adaptive_force_solver.f90 \
            tests/CMakeLists.txt \
            .github/workflows/mumps-direct-ci.yml
          git diff --cached --check
          git config user.name 'Fatih KAVAK'
          git config user.email '83064648+kavakfatih@users.noreply.github.com'
          git commit -m 'solver: Q9/P1 MUMPS direct parity yolunu aç'
          git push origin HEAD:develop/v0.3
