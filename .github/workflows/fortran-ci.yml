name: Fortran CI

on:
  push:
    branches: ['develop/v0.3']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  workflow_dispatch:

concurrency:
  group: dyna-v03-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-linux-gfortran14
          - name: macOS ARM64 / gfortran 14
            os: macos-26
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-macos-gfortran14
          - name: Windows / gfortran 14
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-windows-gfortran14
          - name: Windows 2022 / Intel ifx 2025.2
            os: windows-2022
            compiler: intel
            compiler_version: '2025.2'
            status_context: dyna/v0.3-windows-ifx2025.2

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      # fortran-lang/setup-fortran v1.9.0
      - name: Fortran derleyicisini kur
        id: setup_fortran
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          "$FC" --version || "$FC" /QV
          cmake --version
          ninja --version
          fypp --version
          python --version

      - name: Intel ifx smoke compile
        id: smoke
        if: matrix.compiler == 'intel'
        shell: bash
        run: |
          cat > ifx_smoke.f90 <<'EOF'
          program ifx_smoke
            implicit none
            print *, 'DynaElastomerSolver ifx smoke OK'
          end program ifx_smoke
          EOF
          "$FC" ifx_smoke.f90 -o ifx_smoke.exe
          ./ifx_smoke.exe

      - name: CMake configure
        id: configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DDES_BUILD_TESTS=ON \
            > cmake-configure.log 2>&1
          cat cmake-configure.log

      - name: Derle
        id: build
        shell: bash
        run: cmake --build build --parallel 2

      - name: CTest
        id: ctest
        shell: bash
        run: ctest --test-dir build --output-on-failure --build-config Debug

      - name: V0.3 H3 Q9/P1 mixed u-P acceptance gate
        id: h3
        if: steps.ctest.outcome == 'success'
        shell: bash
        run: |
          python tools/verification/build_v03_h3_acceptance_report.py \
            --production build/tests/V0.3_HERRMANN_PRODUCTION_BENCHMARK_RESULTS.json \
            --mesh-refinement build/tests/V0.3_HERRMANN_MESH_REFINEMENT_RESULTS.json \
            --quadrature build/tests/V0.3_HERRMANN_QUADRATURE_CONVERGENCE_RESULTS.json \
            --ctest-log build/Testing/Temporary/LastTest.log \
            --reference-snapshot docs/verification/results/V0.3_H3_EXTERNAL_REFERENCE_SNAPSHOT.json \
            --json-output ci-artifacts/V0.3_HERRMANN_H3_ACCEPTANCE_RESULTS.json \
            --markdown-output ci-artifacts/V0.3_HERRMANN_H3_ACCEPTANCE_REPORT.md
          echo '=== Q9/P1 Herrmann H3 acceptance ==='
          cat ci-artifacts/V0.3_HERRMANN_H3_ACCEPTANCE_REPORT.md

      - name: V0.3 sparse ve F-bar performans baseline ölç
        id: perf
        if: matrix.os == 'ubuntu-24.04' && steps.ctest.outcome == 'success'
        shell: bash
        run: |
          cd build/tests
          /usr/bin/time -v -o V0.3_FBAR_PERFORMANCE_RSS.txt \
            ./benchmark_v03_fbar_performance
          /usr/bin/time -v -o V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt \
            ./benchmark_v03_herrmann_performance gmres
          echo '=== F-bar performance JSON ==='
          cat V0.3_FBAR_PERFORMANCE_RESULTS.json
          echo
          echo '=== Q9/P1 Herrmann GMRES performance JSON ==='
          cat V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json
          echo
          echo '=== F-bar process peak RSS (/usr/bin/time -v) ==='
          cat V0.3_FBAR_PERFORMANCE_RSS.txt
          echo
          echo '=== Herrmann GMRES process peak RSS (/usr/bin/time -v) ==='
          cat V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt

      - name: V0.3 benchmark artifactlerini hazırla
        if: always()
        shell: bash
        env:
          DYNA_SOURCE_COMMIT: ${{ github.sha }}
          DYNA_RUN_ID: ${{ github.run_id }}
          DYNA_RUNNER: ${{ matrix.os }}
          DYNA_COMPILER: ${{ matrix.compiler }}-${{ matrix.compiler_version }}
          DYNA_CTEST_OUTCOME: ${{ steps.ctest.outcome }}
          DYNA_H3_OUTCOME: ${{ steps.h3.outcome }}
          DYNA_PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          out = Path('ci-artifacts')
          out.mkdir(exist_ok=True)

          required_results = [
              'V0.3_COOK_BAKEOFF_RESULTS.json',
              'V0.3_INCOMPRESSIBILITY_SWEEP_RESULTS.json',
              'V0.3_HERRMANN_PRODUCTION_BENCHMARK_RESULTS.json',
              'V0.3_HERRMANN_MESH_REFINEMENT_RESULTS.json',
              'V0.3_HERRMANN_QUADRATURE_CONVERGENCE_RESULTS.json',
          ]

          missing = []
          for result_name in required_results:
              candidates = list(Path('build').rglob(result_name))
              if candidates:
                  shutil.copy2(candidates[0], out / result_name)
              else:
                  missing.append(result_name)

          if missing and os.environ.get('DYNA_CTEST_OUTCOME') == 'success':
              raise SystemExit(
                  'CTest başarılı fakat zorunlu V0.3 sonuç dosyaları bulunamadı: '
                  + ', '.join(missing)
              )

          h3_results = [
              'V0.3_HERRMANN_H3_ACCEPTANCE_RESULTS.json',
              'V0.3_HERRMANN_H3_ACCEPTANCE_REPORT.md',
          ]
          h3_missing = [name for name in h3_results if not (out / name).exists()]
          if os.environ.get('DYNA_H3_OUTCOME') == 'success' and h3_missing:
              raise SystemExit(
                  'H3 acceptance başarılı fakat artifact eksik: ' + ', '.join(h3_missing)
              )

          performance_results = [
              'V0.3_FBAR_PERFORMANCE_RESULTS.json',
              'V0.3_FBAR_PERFORMANCE_RSS.txt',
              'V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json',
              'V0.3_HERRMANN_PERFORMANCE_GMRES_RSS.txt',
          ]
          perf_missing = []
          for result_name in performance_results:
              candidates = list(Path('build').rglob(result_name))
              if candidates:
                  shutil.copy2(candidates[0], out / result_name)
              else:
                  perf_missing.append(result_name)

          if (
              os.environ.get('DYNA_RUNNER') == 'ubuntu-24.04'
              and os.environ.get('DYNA_PERF_OUTCOME') == 'success'
              and perf_missing
          ):
              raise SystemExit(
                  'Linux performans benchmarkı başarılı fakat artifact eksik: '
                  + ', '.join(perf_missing)
              )

          last_test = Path('build/Testing/Temporary/LastTest.log')
          if last_test.exists():
              shutil.copy2(last_test, out / 'V0.3_CTEST_LASTTEST.log')

          metadata = (
              f"source_commit={os.environ.get('DYNA_SOURCE_COMMIT','')}\n"
              f"run_id={os.environ.get('DYNA_RUN_ID','')}\n"
              f"runner={os.environ.get('DYNA_RUNNER','')}\n"
              f"compiler={os.environ.get('DYNA_COMPILER','')}\n"
              f"ctest={os.environ.get('DYNA_CTEST_OUTCOME','')}\n"
              f"h3={os.environ.get('DYNA_H3_OUTCOME','')}\n"
              f"performance={os.environ.get('DYNA_PERF_OUTCOME','')}\n"
          )
          (out / 'V0.3_CI_METADATA.txt').write_text(metadata, encoding='utf-8')
          PY

      - name: V0.3 benchmark JSON'larını göster
        if: steps.ctest.outcome == 'success'
        shell: bash
        run: |
          echo '=== Cook formulation bake-off ==='
          cat ci-artifacts/V0.3_COOK_BAKEOFF_RESULTS.json
          echo
          echo '=== Incompressibility lambda/mu sweep ==='
          cat ci-artifacts/V0.3_INCOMPRESSIBILITY_SWEEP_RESULTS.json
          echo
          echo '=== Q9/P1 Herrmann production acceptance ==='
          cat ci-artifacts/V0.3_HERRMANN_PRODUCTION_BENCHMARK_RESULTS.json
          echo
          echo '=== Q9/P1 Herrmann mesh refinement ==='
          cat ci-artifacts/V0.3_HERRMANN_MESH_REFINEMENT_RESULTS.json
          echo
          echo '=== Q9/P1 Herrmann quadrature convergence ==='
          cat ci-artifacts/V0.3_HERRMANN_QUADRATURE_CONVERGENCE_RESULTS.json
          if [ -f ci-artifacts/V0.3_HERRMANN_H3_ACCEPTANCE_RESULTS.json ]; then
            echo
            echo '=== Q9/P1 Herrmann H3 unified acceptance ==='
            cat ci-artifacts/V0.3_HERRMANN_H3_ACCEPTANCE_RESULTS.json
          fi
          if [ -f ci-artifacts/V0.3_FBAR_PERFORMANCE_RESULTS.json ]; then
            echo
            echo '=== F-bar large-mesh performance ==='
            cat ci-artifacts/V0.3_FBAR_PERFORMANCE_RESULTS.json
          fi
          if [ -f ci-artifacts/V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json ]; then
            echo
            echo '=== Q9/P1 Herrmann GMRES performance/scaling ==='
            cat ci-artifacts/V0.3_HERRMANN_PERFORMANCE_GMRES_RESULTS.json
          fi

      - name: V0.3 platform benchmark artifactlerini sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-benchmark-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Compiler matrix status yayınla
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup_fortran.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
          H3_OUTCOME: ${{ steps.h3.outcome }}
          PERF_OUTCOME: ${{ steps.perf.outcome }}
        run: |
          $smokeOk = $true
          if ('${{ matrix.compiler }}' -eq 'intel') {
            $smokeOk = ($env:SMOKE_OUTCOME -eq 'success')
          }

          $perfOk = $true
          if ('${{ matrix.os }}' -eq 'ubuntu-24.04') {
            $perfOk = ($env:PERF_OUTCOME -eq 'success')
          }

          $passed = ($env:SETUP_OUTCOME -eq 'success' -and $smokeOk -and $env:CONFIGURE_OUTCOME -eq 'success' -and $env:BUILD_OUTCOME -eq 'success' -and $env:CTEST_OUTCOME -eq 'success' -and $env:H3_OUTCOME -eq 'success' -and $perfOk)
          $state = if ($passed) { 'success' } else { 'failure' }
          $description = "setup=$($env:SETUP_OUTCOME); smoke=$($env:SMOKE_OUTCOME); configure=$($env:CONFIGURE_OUTCOME); build=$($env:BUILD_OUTCOME); ctest=$($env:CTEST_OUTCOME); h3=$($env:H3_OUTCOME); perf=$($env:PERF_OUTCOME)"
          if ($description.Length -gt 140) { $description = $description.Substring(0, 140) }

          $body = @{
            state = $state
            context = '${{ matrix.status_context }}'
            description = $description
            target_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}' -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Configure logunu sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: configure-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: cmake-configure.log
          if-no-files-found: warn
          retention-days: 7
