name: Fortran CI

on:
  push:
    branches: ['develop/v0.3']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  workflow_dispatch:

concurrency:
  group: dyna-v03-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-linux-gfortran14
          - name: macOS ARM64 / gfortran 14
            os: macos-26
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-macos-gfortran14
          - name: Windows / gfortran 14
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
            status_context: dyna/v0.3-windows-gfortran14
          - name: Windows 2022 / Intel ifx 2025.2
            os: windows-2022
            compiler: intel
            compiler_version: '2025.2'
            status_context: dyna/v0.3-windows-ifx2025.2

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      # fortran-lang/setup-fortran v1.9.0
      - name: Fortran derleyicisini kur
        id: setup_fortran
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          "$FC" --version || "$FC" /QV
          cmake --version
          ninja --version
          fypp --version
          python --version

      - name: Intel ifx smoke compile
        id: smoke
        if: matrix.compiler == 'intel'
        shell: bash
        run: |
          cat > ifx_smoke.f90 <<'EOF'
          program ifx_smoke
            implicit none
            print *, 'DynaElastomerSolver ifx smoke OK'
          end program ifx_smoke
          EOF
          "$FC" ifx_smoke.f90 -o ifx_smoke.exe
          ./ifx_smoke.exe

      - name: CMake configure
        id: configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DDES_BUILD_TESTS=ON \
            > cmake-configure.log 2>&1
          cat cmake-configure.log

      - name: Derle
        id: build
        shell: bash
        run: cmake --build build --parallel 2

      - name: CTest
        id: ctest
        shell: bash
        run: ctest --test-dir build --output-on-failure --build-config Debug

      - name: Compiler matrix status yayınla
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup_fortran.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
        run: |
          $smokeOk = $true
          if ('${{ matrix.compiler }}' -eq 'intel') {
            $smokeOk = ($env:SMOKE_OUTCOME -eq 'success')
          }

          $passed = ($env:SETUP_OUTCOME -eq 'success' -and $smokeOk -and $env:CONFIGURE_OUTCOME -eq 'success' -and $env:BUILD_OUTCOME -eq 'success' -and $env:CTEST_OUTCOME -eq 'success')
          $state = if ($passed) { 'success' } else { 'failure' }
          $description = "setup=$($env:SETUP_OUTCOME); smoke=$($env:SMOKE_OUTCOME); configure=$($env:CONFIGURE_OUTCOME); build=$($env:BUILD_OUTCOME); ctest=$($env:CTEST_OUTCOME)"
          if ($description.Length -gt 140) { $description = $description.Substring(0, 140) }

          $body = @{
            state = $state
            context = '${{ matrix.status_context }}'
            description = $description
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}' -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      # actions/upload-artifact v7.0.1
      - name: Configure logunu sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: configure-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: cmake-configure.log
          if-no-files-found: warn
          retention-days: 7
