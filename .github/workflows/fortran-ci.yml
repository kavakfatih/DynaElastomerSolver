name: Fortran CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
          - name: macOS ARM64 / gfortran 14
            os: macos-26
            compiler: gcc
            compiler_version: '14'
          - name: Windows / gfortran 14
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
          - name: Windows / Intel ifx 2025.2
            os: windows-2025
            compiler: intel
            compiler_version: '2025.2'

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Python yalnız stdlib'in fypp önişlemcisi için kullanılır.
      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      # fortran-lang/setup-fortran v1.9.0
      - name: Fortran derleyicisini kur
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          "$FC" --version || "$FC" /QV
          cmake --version
          ninja --version
          fypp --version
          python --version

      - name: CMake configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DDES_BUILD_TESTS=ON

      - name: Derle
        shell: bash
        run: cmake --build build --parallel 2

      - name: CTest
        shell: bash
        run: ctest --test-dir build --output-on-failure --build-config Debug
