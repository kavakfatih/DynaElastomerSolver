name: Fortran CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/reference/**'
      - '.github/workflows/fenicsx-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran 14
            os: ubuntu-24.04
            compiler: gcc
            compiler_version: '14'
          - name: macOS ARM64 / gfortran 14
            os: macos-26
            compiler: gcc
            compiler_version: '14'
          - name: Windows / gfortran 14
            os: windows-2025
            compiler: gcc
            compiler_version: '14'
          - name: Windows 2022 / Intel ifx 2025.2
            os: windows-2022
            compiler: intel
            compiler_version: '2025.2'

    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Python yalnız stdlib'in fypp önişlemcisi için kullanılır.
      # actions/setup-python v6.2.0
      - name: Python 3.12 kur
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          check-latest: false

      - name: fypp 3.2 kur
        run: python -m pip install --disable-pip-version-check fypp==3.2

      # fortran-lang/setup-fortran v1.9.0
      - name: Fortran derleyicisini kur
        id: setup_fortran
        uses: fortran-lang/setup-fortran@2a1b9c55897d827a9dfeb114408f3615e53b2b72
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.compiler_version }}

      - name: Araç sürümlerini kaydet
        shell: bash
        run: |
          echo "FC=$FC"
          "$FC" --version || "$FC" /QV
          cmake --version
          ninja --version
          fypp --version
          python --version

      - name: Intel ifx smoke compile
        id: smoke
        if: matrix.compiler == 'intel'
        shell: bash
        run: |
          cat > ifx_smoke.f90 <<'EOF'
          program ifx_smoke
            implicit none
            print *, 'DynaElastomerSolver ifx smoke OK'
          end program ifx_smoke
          EOF
          "$FC" ifx_smoke.f90 -o ifx_smoke.exe
          ./ifx_smoke.exe

      - name: CMake configure
        id: configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$FC" \
            -DDES_BUILD_TESTS=ON \
            > cmake-configure.log 2>&1
          cat cmake-configure.log

      - name: Derle
        id: build
        shell: bash
        run: cmake --build build --parallel 2

      - name: CTest
        id: ctest
        shell: bash
        run: ctest --test-dir build --output-on-failure --build-config Debug

      - name: Intel ifx V0.2 sonucunu kaydet
        if: always() && matrix.compiler == 'intel'
        shell: pwsh
        env:
          SETUP_OUTCOME: ${{ steps.setup_fortran.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CTEST_OUTCOME: ${{ steps.ctest.outcome }}
        run: |
          $result = [ordered]@{
            schema_version = 1
            milestone = 'V0.2'
            branch = '${{ github.ref_name }}'
            source_commit = '${{ github.sha }}'
            runner = 'windows-2022'
            compiler = 'Intel ifx 2025.2'
            setup_fortran = $env:SETUP_OUTCOME
            smoke_compile = $env:SMOKE_OUTCOME
            cmake_configure = $env:CONFIGURE_OUTCOME
            build = $env:BUILD_OUTCOME
            ctest = $env:CTEST_OUTCOME
            all_passed = ($env:SETUP_OUTCOME -eq 'success' -and $env:SMOKE_OUTCOME -eq 'success' -and $env:CONFIGURE_OUTCOME -eq 'success' -and $env:BUILD_OUTCOME -eq 'success' -and $env:CTEST_OUTCOME -eq 'success')
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          }

          New-Item -ItemType Directory -Force -Path 'docs/verification/results' | Out-Null
          $result | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 'docs/verification/results/IFX_V0.2_CI.json'

          git config user.name 'DynaElastomerSolver CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/verification/results/IFX_V0.2_CI.json
          git commit -m 'CI: V0.2 ifx doğrulama sonucunu kaydet'
          if ($LASTEXITCODE -eq 0) {
            git push origin HEAD:main
          }

      # actions/upload-artifact v7.0.1
      - name: Configure logunu sakla
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: configure-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ runner.os }}
          path: cmake-configure.log
          if-no-files-found: warn
          retention-days: 7
