name: B7 AUTO Policy One-Shot Apply

on:
  push:
    branches: ['develop/v0.3']
    paths:
      - '.github/workflows/b7-auto-policy-apply.yml'
      - '.github/b7_apply_patch.py'
      - '.github/b7_run_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop/v0.3
          fetch-depth: 0

      - name: Assert kontrollü B7 source/test patch uygula
        run: python .github/b7_run_patch.py

      - name: Diff ve Fortran satır uzunluğu kontrolü
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('src/fortran/solvers/des_linear_solver.f90'),
              Path('src/fortran/solvers/des_sparse_solver_context.f90'),
              Path('tests/test_auto_sparse_solver_policy.f90'),
          ]
          bad = []
          for path in files:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if len(line) > 132:
                      bad.append(f'{path}:{number}:{len(line)}')
          if bad:
              raise SystemExit('132 sütun sınırı aşıldı:\n' + '\n'.join(bad))
          print('Fortran 132 sütun kontrolü PASS')
          PY

      - name: B7 teknik commitini oluştur ve push et
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/fortran/solvers/des_linear_solver.f90 \
            src/fortran/solvers/des_sparse_solver_context.f90 \
            tests/CMakeLists.txt \
            tests/test_auto_sparse_solver_policy.f90
          git diff --cached --check
          git commit -m 'feat: B7 AUTO sparse solver policy temelini ekle'
          git push origin HEAD:develop/v0.3
